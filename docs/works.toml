# Everything listed on the home page. tools/site/home.py renders the films, "Latest" and "By topic" into index.html
# and one page per topic into topics/<key>.html; edit here, not in the generated pages.
#
# [topics], in the order shown: title, note (one short sentence), optional collapsed = true (folded on the home page),
# optional anchors (old ids that should still land on this topic, e.g. the retired #other).
#
# Per work:
#   href, published (YYYY-MM-DD; the row shows its month)
#   title     the article's own title, as in its <h1>: short and inviting, a question or a plain vivid phrase that says
#             why a reader would care, at most 60 characters, no number but a year, no ":" or "%"; parts are shown as
#             "Part n · <title>" in the order listed here
#   label     one of: Registered study · Pre-specified · Exploratory · Note · Tool · Series · Thesis
#   detail    optional; shown on hover over the label (e.g. "stage B in 2027", "v0.1.0")
#   progress  optional; true adds a small "in progress" marker to the label
#   finding   optional; the article's deck: one plain sentence of what came out, never stronger than the study's label
#             (in plain words, e.g. "too few towns to rule out no change" for underpowered) and not repeating the title;
#             shown under the title on the Latest cards and in every row
#   topic     a key of [topics]; leave it out for a page that is listed nowhere in the catalogue (the method note)
#   series    optional; href of the hub this is a part of (parts sit under their hub, which has label = "Series")
#   date      optional; shown instead of published (theses)
#   top = n   optional; shown as the n-th film at the top of the home page, with a [works.film] block
#
# Latest: the six most recent works by published, hubs by their own date, parts left out. By topic: each topic's four
# most recent rows on the home page (a series counts as one row, dated by its newest part), all of them on its page.

[topics]
transit = { title = "Getting around", note = "Trams, buses, roads and the air over Czechia, and how forecasts for them are checked." }
prague = { title = "Prague", note = "One city, from the data it publishes about itself." }
money = { title = "State and money", note = "What the Czech state subsidises, buys, spends and votes for, and what a lottery pays back.", anchors = ["other"] }
culture = { title = "Culture", note = "Music charts and tours, song contests, film grants, adverts, actor memes on Wikipedia and data turned into sound." }
sport = { title = "Sport", note = "How many of a country's players reach the strongest leagues, per head, against its peers." }
ai = { title = "AI and data", note = "Assistants over warehouses, and the tools that check them." }
theses = { title = "Theses", note = "Three university theses, on transit delays, a university's logs and EU votes.", collapsed = true }

# ---------------------------------------------------------------- Getting around

[[works]]
href = "texts/gnss-interference"
title = "Are planes over Czechia reporting bad GPS?"
finding = "Aircraft cruising over Czechia reported degraded satellite positions about as often as over Austria and Switzerland, at most a point more, while over Poland and the Baltic states they reported them more often."
label = "Registered study"
published = "2026-10-26"
topic = "transit"

[[works]]
href = "texts/bypass-accidents"
title = "Are towns calmer after the bypass opens?"
finding = "Inside 35 Czech towns, police recorded about a fifth fewer injury crashes after a bypass opened than in towns still waiting, but with so few towns the data can't rule out no change at all."
label = "Registered study"
published = "2026-10-26"
topic = "transit"

[[works]]
href = "texts/blackout"
title = "The day Prague's trams stopped"
finding = "When the Czech grid split at noon on 4 July 2025, 56 % of Prague's tram service stood still, half of it was moving again by 13:30 and nine tenths by 15:00."
label = "Registered study"
published = "2026-10-14"
topic = "transit"

[[works]]
href = "texts/weather-rails"
title = "Weather on the rails"
finding = "In rain hours Prague's trams fell about ten seconds further behind, not all of it the rain, in hot hours a little less, against expectations, and rain did not shorten weekend stops."
