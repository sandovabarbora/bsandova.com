# Everything listed on the home page. tools/site/home.py renders the films and "All work" from this file into
# index.html; edit here, not in index.html.
#
# Per work: href, title, kind (small label), status, published (YYYY-MM-DD; the row shows its month), topic (a key of
# [topics]), optional series (href of the hub this is a part of), optional date (shown instead of published, for
# theses; within a topic, series come first, then the rest, newest first), optional top = n (shown as the n-th film at the top of the home page, with a [works.film] block).

[topics]
transit = { title = "Getting around", note = "Trams, buses and streets: delays, weather, fares and darkness." }
prague = { title = "Prague", note = "One city, from the data it publishes about itself." }
culture = { title = "Culture", note = "Music charts and tours, song contests, film grants, adverts, and data turned into sound." }
sport = { title = "Sport", note = "Who a country produces, per capita, compared with its peers." }
ai = { title = "AI and data", note = "Assistants over warehouses, and the tools that check them." }
other = { title = "Everything else", note = "Lotteries, a forecast check, a thesis on EU votes and how the studies here are planned." }

