name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/site/check_standard.py   # the editorial gate the deploy runs, before merge
      - run: python3 tools/site/home.py --check
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pytest && python -m pytest -q surf/tests weather/tests ask/test_eval_guard.py tools/site/test_status_check.py   # the verifiers' tests, the eval guard and the status verdicts
      - run: pip install -q -r tools/requirements-tests.txt
      # the study suites (made-up data) and the golden-master pins; pins whose inputs live only in tools/data skip here
      - run: python -m pytest -q -rs tools/rain tools/heat tools/late tools/bunch tools/gehl tools/transfer tools/dst tools/eurovision tools/eras
