name: weather forecast collector
on:
  schedule:
    - cron: "40 6 * * *"   # 06:40 UTC daily, after ČHMÚ has rewritten yesterday's file
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python weather/collect.py
      - run: python weather/verify.py
      - run: |
          git config user.name "weather-collector"
          git config user.email "weather-collector@users.noreply.github.com"
          git add weather/data weather/data.json
          git commit -m "weather: $(date -u +%F)" || echo "nothing to commit"
          git push
