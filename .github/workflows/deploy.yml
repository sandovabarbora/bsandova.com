name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the changelog is generated from the full git log
      - run: ./build.sh   # deploy-only stamps (?v=<sha>, titles, JSON-LD, feed) on this throwaway checkout
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.131.2"   # assets-only workers need wrangler 4
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
