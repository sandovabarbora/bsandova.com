name: status check
on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC daily, after the collectors and their deploy
  workflow_dispatch:
    inputs:
      test_mail:
        description: "send the report even when everything is fine"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: check
        run: |
          set +e
          REPORT_PATH=report.txt GITHUB_TOKEN=${{ github.token }} python tools/status_check.py
          rc=$?
          echo "problems=$rc" >> "$GITHUB_OUTPUT"
          echo "exit code $rc"
      - name: mail the report when something is late, stale or failed
        if: steps.check.outputs.problems != '0' || inputs.test_mail
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SUBJECT: "bsandova.com status: ${{ steps.check.outputs.problems != '0' && 'something needs a look' || 'all clear (test)' }}"
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          m = EmailMessage()
          m["From"] = f"bsandova.com status <{os.environ['MAIL_USER']}>"
          m["To"] = "hello@bsandova.com"
          m["Subject"] = os.environ["SUBJECT"]
          m.set_content(open("report.txt").read())
          with smtplib.SMTP_SSL("smtp.zoho.eu", 465, context=ssl.create_default_context()) as s:
              s.login(os.environ["MAIL_USER"], os.environ["MAIL_PASS"])
              s.send_message(m)
          print("sent")
          PY
